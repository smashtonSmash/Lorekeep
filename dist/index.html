our draconic ancestry."}],subraces:[]},{key:"dwarf",name:"Dwarf",speed:25,size:"Medium",bonuses:{con:2},languages:["Common","Dwarvish"],traits:[{name:"Darkvision",desc:"You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray."},{name:"Dwarven Resilience",desc:"You have advantage on saving throws against poison, and you have resistance against poison damage."},{name:"Stonecunning",desc:"Whenever you make an Intelligence (History) check related to the origin of stonework, you are considered proficient in the History skill and add double your proficiency bonus to the check, instead of your normal proficiency bonus."},{name:"Dwarven Combat Training",desc:"You have proficiency with the battleaxe, handaxe, light hammer, and warhammer."},{name:"Tool Proficiency",desc:"You gain proficiency with the artisan's tools of your choice: smith's tools, brewer's supplies, or mason's tools."}],subraces:[{key:"hill-dwarf",name:"Hill Dwarf",bonuses:{wis:1},traits:[{name:"Dwarven Toughness",desc:"Your hit point maximum increases by 1, and it increases by 1 every time you gain a level."}]}]},{key:"elf",name:"Elf",speed:30,size:"Medium",bonuses:{dex:2},languages:["Common","Elvish"],traits:[{name:"Darkvision",desc:"You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray."},{name:"Fey Ancestry",desc:"You have advantage on saving throws against being charmed, and magic cannot put you to sleep."},{name:"Trance",desc:'Elves do not need to sleep. Instead, they meditate deeply, remaining semiconscious, for 4 hours a day. (The Common word for such meditation is "trance.") While meditating, you can dream after a fashion; such dreams are actually mental exercises that have become reflexive through years of practice. After resting this way, you gain the same benefit that a human does from 8 hours of sleep.'},{name:"Keen Senses",desc:"You have proficiency in the Perception skill."}],subraces:[{key:"high-elf",name:"High Elf",bonuses:{int:1},traits:[{name:"Elf Weapon Training",desc:"You have proficiency with the longsword, shortsword, shortbow, and longbow."},{name:"High Elf Cantrip",desc:"You know one cantrip of your choice form the wizard spell list. Intelligence is your spellcasting ability for it."},{name:"Extra Language",desc:"You can speak, read, and write one extra language of your choice."}]}]},{key:"gnome",name:"Gnome",speed:25,size:"Small",bonuses:{int:2},languages:["Common","Gnomish"],traits:[{name:"Darkvision",desc:"You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray."},{name:"Gnome Cunning",desc:"You have advantage on all Intelligence, Wisdom, and Charisma saving throws against magic."}],subraces:[{key:"rock-gnome",name:"Rock Gnome",bonuses:{con:1},traits:[{name:"Artificer's Lore",desc:"Whenever you make an Intelligence (History) check related to magic items, alchemical objects, or technological devices, you can add twice your proficiency bonus, instead of any proficiency bonus you normally apply."},{name:"Tinker",desc:"You have proficiency with artisan's tools (tinker's tools). Using those tools, you can spend 1 hour and 10 gp worth of materials to construct a Tiny clockwork device (AC 5, 1 hp). The device ceases to function after 24 hours (unless you spend 1 hour repairing it to keep the device functioning), or when you use your action to dismantle it; at that time, you can reclaim the materials used to create it. You can have up to three such devices active at a time. When you create a device, choose one of the following options: Clockwork Toy: This toy is a clockwork animal, monster, or person, such as a frog, mouse, bird, dragon, or soldier. When placed on the ground, the toy moves 5 feet across the ground on each of your turns in a random direction. It makes noises as appropriate to the creature it represents. Fire Starter: The device produces a miniature flame, which you can use to light a candle, torch, or campfire. Using the device requires your action. Music Box: When opened, this music box plays a single song at a moderate volume. The box stops playing when it reaches the song's end or when it is closed."}]}]},{key:"half-elf",name:"Half-Elf",speed:30,size:"Medium",bonuses:{cha:2},bonusChoice:{choose:2,amount:1},languages:["Common","Elvish"],traits:[{name:"Darkvision",desc:"You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray."},{name:"Fey Ancestry",desc:"You have advantage on saving throws against being charmed, and magic cannot put you to sleep."},{name:"Skill Versatility",desc:"You gain proficiency in two skills of your choice."}],subraces:[]},{key:"half-orc",name:"Half-Orc",speed:30,size:"Medium",bonuses:{str:2,con:1},languages:["Common","Orc"],traits:[{name:"Darkvision",desc:"You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray."},{name:"Savage Attacks",desc:"When you score a critical hit with a melee weapon attack, you can roll one of the weapon's damage dice one additional time and add it to the extra damage of the critical hit."},{name:"Relentless Endurance",desc:"When you are reduced to 0 hit points but not killed outright, you can drop to 1 hit point instead. you cannot use this feature again until you finish a long rest."},{name:"Menacing",desc:"You gain proficiency in the Intimidation skill."}],subraces:[]},{key:"halfling",name:"Halfling",speed:25,size:"Small",bonuses:{dex:2},languages:["Common","Halfling"],traits:[{name:"Brave",desc:"You have advantage on saving throw against being frightened."},{name:"Halfling Nimbleness",desc:"You can move through the space of any creature that is of a size larger than yours."},{name:"Lucky",desc:"When you roll a 1 on the d20 for an attack roll, ability check, or saving throw, you can reroll the die and must use the new roll."}],subraces:[{key:"lightfoot-halfling",name:"Lightfoot Halfling",bonuses:{cha:1},traits:[{name:"Naturally Stealthy",desc:"You can attempt to hide even when you are obscured only by a creature that is at least one size larger than you."}]}]},{key:"human",name:"Human",speed:30,size:"Medium",bonuses:{str:1,dex:1,con:1,int:1,wis:1,cha:1},languages:["Common"],traits:[],subraces:[]},{key:"tiefling",name:"Tiefling",speed:30,size:"Medium",bonuses:{int:1,cha:2},languages:["Common","Infernal"],traits:[{name:"Darkvision",desc:"You have superior vision in dark and dim conditions. You can see in dim light within 60 feet of you as if it were bright light, and in darkness as if it were dim light. You cannot discern color in darkness, only shades of gray."},{name:"Hellish Resistance",desc:"You have resistance to fire damage."},{name:"Infernal Legacy",desc:"You know the thaumaturgy cantrip. When you reach 3rd level, you can cast the hellish rebuke spell as a 2nd-level spell once with this trait and regain the ability to do so when you finish a long rest. When you reach 5th level, you can cast the darkness spell once with this trait and regain the ability to do so when you finish a long rest. Charisma is your spellcasting ability for these spells."}],subraces:[]}],classes:[{key:"barbarian",name:"Barbarian",hitDie:12,saves:["str","con"],proficiencies:["Light Armor","Medium Armor","Shields","Simple Weapons","Martial Weapons"],skillChoice:{choose:2,from:["Animal Handling","Athletics","Intimidation","Nature","Perception","Survival"]},features:[{name:"Rage",desc:"In battle, you fight with primal ferocity. On your turn, you can enter a rage as a bonus action. While raging, you gain the following benefits if you aren't wearing heavy armor: - You have advantage on Strength checks and Strength saving throws. - When you make a melee weapon Attack using Strength, you gain a +2 bonus to the damage roll. This bonus increases as you level. - You have Resistance to bludgeoning, piercing, and slashing damage. If you are able to cast Spells, you can't cast them or concentrate on them while raging. Your rage lasts for 1 minute. It ends early if you are knocked Unconscious or if Your Turn ends and you haven't attacked a hostile creature since your last turn or taken damage since then. You can also end your rage on Your Turn as a Bonus Action. Once you have raged the maximum number of times for your barbarian level, you must finish a Long Rest before you can rage again. You may rage 2 times at 1st level, 3 at 3rd, 4 at 6th, 5 at 12th, and 6 at 17th."},{name:"Unarmored Defense",desc:"While you are not wearing any armor, your Armor Class equals 10 + your Dexterity modifier + your Constitution modifier. You can use a shield and still gain this benefit."}]},{key:"bard",name:"Bard",hitDie:8,saves:["dex","cha"],proficiencies:["Light Armor","Simple Weapons","Longswords","Rapiers","Shortswords","Hand crossbows"],skillChoice:{choose:3,from:["Acrobatics","Animal Handling","Arcana","Athletics","Deception","History","Insight","Intimidation","Investigation","Medicine","Nature","Perception","Performance","Persuasion","Religion","Sleight of Hand","Stealth","Survival"]},features:[{name:"Spellcasting: Bard",desc:"You have learned to untangle and reshape the fabric of reality in harmony with your wishes and music. Your spells are part of your vast repertoire, magic that you can tune to different situations."},{name:"Bardic Inspiration (d6)",desc:"You can inspire others through stirring words or music. To do so, you use a bonus action on your turn to choose one creature other than yourself within 60 feet of you who can hear you. That creature gains one Bardic Inspiration die, a d6. Once within the next 10 minutes, the creature can roll the die and add the number rolled to one ability check, attack roll, or saving throw it makes. The creature can wait until after it rolls the d20 before deciding to use the Bardic Inspiration die, but must decide before the GM says whether the roll succeeds or fails. Once the Bardic Inspiration die is rolled, it is lost. A creature can have only one Bardic Inspiration die at a time. You can use this feature a number of times equal to your Charisma modifier (a minimum of once). You regain any expended uses when you finish a long rest.  Your Bardic Inspiration die changes when you reach certain levels in this class. The die becomes a d8 at 5th level, a d10 at 10th level, and a d12 at 15th level."}],spellcasting:"cha"},{key:"cleric",name:"Cleric",hitDie:8,saves:["wis","cha"],proficiencies:["Light Armor","Medium Armor","Shields","Simple Weapons"],skillChoice:{choose:2,from:["History","Insight","Medicine","Persuasion","Religion"]},features:[{name:"Spellcasting: Cleric",desc:"As a conduit for divine power, you can cast cleric spells."},{name:"Divine Domain",desc:"Choose one domain related to your deity, such as Knowledge, Life, Light, Nature, Tempest, Trickery, or War. Only the Life domain is detailed in the Open Game Licensed SRD. Additional Domains are described in the official rulebooks or products from other publishers. Your domain grants you domain spells and other features when you choose it at 1st level. It also grants you additional ways to use Channel Divinity when you gain that feature at 2nd level, and additional benefits at 6th, 8th, and 17th levels."},{name:"Domain Spells",desc:"Each domain has a list of spells--its domain spells--that you gain at the cleric levels noted in the domain description. Once you gain a domain spell, you always have it prepared, and it doesn't count against the number of spells you can prepare each day. If you have a domain spell that doesn't appear on the cleric spell list, the spell is nonetheless a cleric spell for you."}],spellcasting:"wis"},{key:"druid",name:"Druid",hitDie:8,saves:["int","wis"],proficiencies:["Light Armor","Medium Armor","Shields","Clubs","Daggers","Javelins","Maces","Quarterstaffs","Sickles","Spears","Darts","Slings","Scimitars","Herbalism Kit"],skillChoice:{choose:2,from:["Arcana","Animal Handling","Insight","Medicine","Nature","Perception","Religion","Survival"]},features:[{name:"Spellcasting: Druid",desc:"Drawing on the divine essence of nature itself, you can cast spells to shape that essence to your will."},{name:"Druidic",desc:"You know Druidic, the secret language of druids. You can speak the language and use it to leave hidden messages. You and others who know this language automatically spot such a message. Others spot the message's presence with a successful DC 15 Wisdom (Perception) check but can't decipher it without magic."}],spellcasting:"wis"},{key:"fighter",name:"Fighter",hitDie:10,saves:["str","con"],proficiencies:["All armor","Shields","Simple Weapons","Martial Weapons"],skillChoice:{choose:2,from:["Acrobatics","Animal Handling","Athletics","History","Insight","Intimidation","Perception","Survival"]},features:[{name:"Fighting Style",desc:"You adopt a particular style of fighting as your specialty. Choose one of the following options. You can't take a Fighting Style option more than once, even if you later get to choose again."},{name:"Second Wind",desc:"You have a limited well of stamina that you can draw on to protect yourself from harm. On your turn, you can use a bonus action to regain hit points equal to 1d10 + your fighter level. Once you use this feature, you must finish a short or long rest before you can use it again."}]},{key:"monk",name:"Monk",hitDie:8,saves:["str","dex"],proficiencies:["Simple Weapons","Shortswords"],skillChoice:{choose:2,from:["Acrobatics","Athletics","History","Insight","Religion","Stealth"]},features:[{name:"Unarmored Defense",desc:"Beginning at 1st level, while you are wearing no armor and not wielding a shield, your AC equals 10 + your Dexterity modifier + your Wisdom modifier."},{name:"Martial Arts",desc:"At 1st level, your practice of martial arts gives you mastery of combat styles that use unarmed strikes and monk weapons, which are shortswords and any simple melee weapons that don't have the two- handed or heavy property. You gain the following benefits while you are unarmed or wielding only monk weapons and you aren't wearing armor or wielding a shield: - You can use Dexterity instead of Strength for the attack and damage rolls of your unarmed strikes and monk weapons. - You can roll a d4 in place of the normal damage of your unarmed strike or monk weapon. This die changes as you gain monk levels, as shown in the Martial Arts column of Table: The Monk. - When you use the Attack action with an unarmed strike or a monk weapon on your turn, you can make one unarmed strike as a bonus action. For example, if you take the Attack action and attack with a quarterstaff, you can also make an unarmed strike as a bonus action, assuming you haven't already taken a bonus action this turn. Certain monasteries use specialized forms of the monk weapons. For example, you might use a club that is two lengths of wood connected by a short chain (called a nunchaku) or a sickle with a shorter, straighter blade (called a kama). Whatever name you use for a monk weapon, you can use the game statistics provided for the weapon."}]},{key:"paladin",name:"Paladin",hitDie:10,saves:["wis","cha"],proficiencies:["All armor","Shields","Simple Weapons","Martial Weapons"],skillChoice:{choose:2,from:["Athletics","Insight","Intimidation","Medicine","Persuasion","Religion"]},features:[{name:"Divine Sense",desc:"The presence of strong evil registers on your senses like a noxious odor, and powerful good rings like heavenly music in your ears. As an action, you can open your awareness to detect such forces. Until the end of your next turn, you know the location of any celestial, fiend, or undead within 60 feet of you that is not behind total cover. You know the type (celestial, fiend, or undead) of any being whose presence you sense, but not its identity. Within the same radius, you also detect the presence of any place or object that has been consecrated or desecrated, as with the hallow spell. You can use this feature a number of times equal to 1 + your Charisma modifier. When you finish a long rest, you regain all expended uses."},{name:"Lay on Hands",desc:"Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you take a long rest. With that pool, you can restore a total number of hit points equal to your paladin level x 5. As an action, you can touch a creature and draw power from the pool to restore a number of hit points to that creature, up to the maximum amount remaining in your pool. Alternatively, you can expend 5 hit points from your pool of healing to cure the target of one disease or neutralize one poison affecting it. You can cure multiple diseases and neutralize multiple poisons with a single use of Lay on Hands, expending hit points separately for each one. This feature has no effect on undead and constructs."}],spellcasting:"cha"},{key:"ranger",name:"Ranger",hitDie:10,saves:["str","dex"],proficiencies:["Light Armor","Medium Armor","Shields","Simple Weapons","Martial Weapons"],skillChoice:{choose:3,from:["Animal Handling","Athletics","Insight","Investigation","Nature","Perception","Stealth","Survival"]},features:[{name:"Favored Enemy (1 type)",desc:"Beginning at 1st level, you have significant experience studying, tracking, hunting, and even talking to a certain type of enemy. Choose a type of favored enemy: aberrations, beasts, celestials, constructs, dragons, elementals, fey, fiends, giants, monstrosities, oozes, plants, or undead. Alternatively, you can select two races of humanoid (such as gnolls and orcs) as favored enemies. You have advantage on Wisdom (Survival) checks to track your favored enemies, as well as on Intelligence checks to recall information about them. When you gain this feature, you also learn one language of your choice that is spoken by your favored enemies, if they speak one at all. You choose one additional favored enemy, as well as an associated language, at 6th and 14th level. As you gain levels, your choices should reflect the types of monsters you have encountered on your adventures."},{name:"Natural Explorer (1 terrain type)",desc:"You are particularly familiar with one type of natural environment and are adept at traveling and surviving in such regions. Choose one type of favored terrain: arctic, coast, desert, forest, grassland, mountain, or swamp. When you make an Intelligence or Wisdom check related to your favored terrain, your proficiency bonus is doubled if you are using a skill that you're proficient in. While traveling for an hour or more in your favored terrain, you gain the following benefits: - Difficult terrain doesn't slow your group's travel. - Your group can't become lost except by magical means. - Even when you are engaged in another activity while traveling (such as foraging, navigating, or tracking), you remain alert to danger. - If you are traveling alone, you can move stealthily at a normal pace. - When you forage, you find twice as much food as you normally would. - While tracking other creatures, you also learn their exact number, their sizes, and how long ago they passed through the area. You choose additional favored terrain types at 6th and 10th level."}],spellcasting:"wis"},{key:"rogue",name:"Rogue",hitDie:8,saves:["dex","int"],proficiencies:["Light Armor","Simple Weapons","Longswords","Rapiers","Shortswords","Hand crossbows","Thieves' Tools"],skillChoice:{choose:4,from:["Acrobatics","Athletics","Deception","Insight","Intimidation","Investigation","Perception","Performance","Persuasion","Sleight of Hand","Stealth"]},features:[{name:"Expertise",desc:"At 1st level, choose two of your skill proficiencies, or one of your skill proficiencies and your proficiency with thieves' tools. Your proficiency bonus is doubled for any ability check you make that uses either of the chosen proficiencies. At 6th level, you can choose two more of your proficiencies (in skills or with thieves' tools) to gain this benefit"},{name:"Sneak Attack",desc:"Beginning at 1st level, you know how to strike subtly and exploit a foe's distraction. Once per turn, you can deal an extra 1d6 damage to one creature you hit with an attack if you have advantage on the attack roll. The attack must use a finesse or a ranged weapon. You don't need advantage on the attack roll if another enemy of the target is within 5 feet of it, that enemy isn't incapacitated, and you don't have disadvantage on the attack roll. The amount of the extra damage increases as you gain levels in this class, as shown in the Sneak Attack column of the Rogue table."},{name:"Thieves' Cant",desc:"During your rogue training you learned thieves' cant, a secret mix of dialect, jargon, and code that allows you to hide messages in seemingly normal conversation. Only another creature that knows thieves' cant understands such messages. It takes four times longer to convey such a message than it does to speak the same idea plainly. In addition, you understand a set of secret signs and symbols used to convey short, simple messages, such as whether an area is dangerous or the territory of a thieves' guild, whether loot is nearby, or whether the people in an area are easy marks or will provide a safe house for thieves on the run."}]},{key:"sorcerer",name:"Sorcerer",hitDie:6,saves:["con","cha"],proficiencies:["Daggers","Darts","Slings","Quarterstaffs","Crossbows, light"],skillChoice:{choose:2,from:["Arcana","Deception","Insight","Intimidation","Persuasion","Religion"]},features:[{name:"Spellcasting: Sorcerer",desc:"An event in your past, or in the life of a parent or ancestor, left an indelible mark on you, infusing you with arcane magic. This font of magic, whatever its origin, fuels your spells."},{name:"Sorcerous Origin",desc:"Choose a sorcerous origin, which describes the source of your innate magical power, such as Draconic Bloodline. Your choice grants you features when you choose it at 1st level and again at 6th, 14th, and 18th level."}],spellcasting:"cha"},{key:"warlock",name:"Warlock",hitDie:8,saves:["wis","cha"],proficiencies:["Light Armor","Simple Weapons"],skillChoice:{choose:2,from:["Arcana","Deception","History","Intimidation","Investigation","Nature","Religion"]},features:[{name:"Otherworldly Patron",desc:"At 1st level, you have struck a bargain with an otherworldly being of your choice, such as the Fiend. Your choice grants you features at 1st level and again at 6th, 10th, and 14th level."},{name:"Pact Magic",desc:"Your arcane research and the magic bestowed on you by your patron have given you facility with spells."}],spellcasting:"cha"},{key:"wizard",name:"Wizard",hitDie:6,saves:["int","wis"],proficiencies:["Daggers","Darts","Slings","Quarterstaffs","Crossbows, light"],skillChoice:{choose:2,from:["Arcana","History","Insight","Investigation","Medicine","Religion"]},features:[{name:"Spellcasting: Wizard",desc:"As a student of arcane magic, you have a spellbook containing spells that show the first glimmerings of your true power."},{name:"Arcane Recovery",desc:"You have learned to regain some of your magical energy by studying your spellbook. Once per day when you finish a short rest, you can choose expended spell slots to recover. The spell slots can have a combined level that is equal to or less than half your wizard level (rounded up), and none of the slots can be 6th level or higher. For example, if you're a 4th-level wizard, you can recover
